<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Feliz Cumpleaños</title>

  <link rel="stylesheet" href="styles.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <!-- Confeti atrás -->
  <canvas id="canvas1"></canvas>

  <!-- CONTENEDOR -->
  <div class="contenedor">

    <!-- Objetos -->
    <div class="portaretrato-torta-caja oculto">

      <!-- PORTARETRATO -->
      <div class="portaretrato">

        <div class="marco">
          <img src="recursos/cumpleañero.png" alt="Foto">
        </div>

        <div class="soporte-marco"></div>

      </div>

      <!-- TORTA -->
      <div class="torta-cumpleaños">

        <div class="torta">
          <div class="chocolate"></div>
        </div>

        <div class="vela"></div>

        <div class="llama"></div>

      </div>

      <!-- REGALO -->
      <div class="caja-wrapper">

        <div class="caja">

          <div class="cinta-de-regalo">

            <div class="cinta-de-regalo-izquierda"></div>

            <div class="cinta-de-regalo-derecha"></div>

            <div class="cinta-de-regalo-centro"></div>

          </div>

          <div class="regalos">
            <div class="regalo-sombra"></div>
          </div>

          <div class="regalo"></div>

          <!-- estrellas -->
          <div class="icono-estrella estrella1"></div>
          <div class="icono-estrella estrella2"></div>
          <div class="icono-estrella estrella3"></div>
          <div class="icono-estrella estrella4"></div>
          <div class="icono-estrella estrella5"></div>

        </div>

      </div>

      <!-- TEXTO -->
      <div class="happy-birthday">
        Happy Birthday
      </div>

    </div>

    <!-- MESA -->
    <div class="soporte oculto"></div>

  </div>

  <!-- MODAL CARTA -->
  <div class="modal-carta" id="modalCarta">

    <div class="contenido-carta">

      <div class="carta">

        <h2>Querida Carol</h2>

        <p>
          Hoy es un día muy especial y quería recordarte
          lo increíble que eres.
        </p>

        <p>
          Espero que este cumpleaños esté lleno de alegría,
          sorpresas y muchísimos momentos felices.
        </p>

        <p class="firma">
          Con cariño ❤️
        </p>

      </div>

    </div>

  </div>

  <!-- Confeti delante -->
  <canvas id="canvas2"></canvas>

  <!-- Audios -->
  <audio
    id="soplido"
    src="recursos/soplar1.mp3"
    preload="auto">
  </audio>

  <audio
    id="cancion"
    src="recursos/cancion.mp3"
    preload="auto">
  </audio>
<!-->
  <!-- Overlay -->
  <div class="overlay"></div>

  <!-- Scripts -->
  <script src="Confeti.js"></script>
  <script src="Confeti2.js"></script>
  <script src="Sorpresa.js"></script>

</body>
</html>
